<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>HTML Computercode 練習</title>
    <style>
        /* 建立圖片中的外框與陰影效果 */
        .code-box {
            border: 1px solid #000;
            padding: 20px;
            width: fit-content;
            margin: 20px;
            box-shadow: 8px 8px 5px #888888;
            font-family: Arial, sans-serif;
        }

        /* 程式碼字型設定 */
        code {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="code-box">
        <p>Code example:</p>

        <pre><code>var person = {
    firstName: "昱翔",
    lastName : "陳",
    studentId: "113403516"
}</code></pre>
    </div>

</body>
</html>
