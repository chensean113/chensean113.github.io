<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SVG 圓形與矩形重疊</title>
</head>
<body>

    <svg width="500" height="300">
        
        <rect x="50" y="50" width="200" height="150" 
              fill="blue" stroke="black" stroke-width="5" />

        <circle cx="275" cy="125" r="75" 
                fill="yellow" stroke="red" stroke-width="5" />
                
    </svg>

</body>
</html>
