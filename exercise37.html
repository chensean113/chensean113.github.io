<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>陳昱翔</title>
  
</head>
<body>
  <p id="result"></p>
  <script>
  function calcCircumfrence(radius) {
      return  2 * Math.PI * radius;
  }
  function calcArea(radius) {
      return  Math.PI * radius * radius;
  } 
  document.getElementById("demo").innerHTML = "圓周長是：" + calcCircumfrence() + "<br>圓面積是：" + calcArea();
  </script> 
</body>
</html>
