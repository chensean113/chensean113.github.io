<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout Practice</title>
    <style>
        /* 基本頁面樣式：模擬圖片中的藍色背景 */
        body {
            background-color: #64b5f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* 加入這行：當畫面寬度不夠時，允許卡片自動換到下一行 */
            gap: 30px;       /* 加入這行：設定卡片之間的間距為 30px，避免黏在一起 */
            font-family: Arial, sans-serif;
        }

        /* 白色主卡片容器 */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 區塊共通樣式 */
        .block {
            border-radius: 4px;
            min-height: 50px;
        }

        /* 頂部綠色區塊 (Header) */
        .header {
            background-color: #aed581;
            height: 100px;
            width: 100%;
            margin-bottom: 15px;
        }

        /* 中間藍色區塊區域 */
        .middle-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .middle-block {
            background-color: #00bcd4;
            flex: 1; /* 平分寬度 */
            height: 120px;
        }

        /* 底部灰色區塊區域 */
        .bottom-container {
            display: grid;
            gap: 10px;
        }

        .bottom-block {
            background-color: #eceff1;
            height: 40px;
        }

        /* ==========================================
           響應式佈局設定 (Media Queries)
           ========================================== */

        /* 預設狀態 (b)：大螢幕 (螢幕寬度 >= 480px) */
        .bottom-container {
            grid-template-columns: repeat(4, 1fr); /* 4 欄並排 */
        }

        /* 狀態 (a)：小螢幕 (當寬度小於 480px 時) */
        @media (max-width: 479px) {
            /* 中間區塊改為直排 */
            .middle-container {
                flex-direction: column;
            }

            .middle-block {
                height: 60px; /* 直排時縮小高度 */
            }

            /* 底部區塊改為 2x2 網格 */
            .bottom-container {
                grid-template-columns: repeat(2, 1fr); /* 2 欄 */
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 頂部綠色區塊 -->
        <div class="header block"></div>

        <!-- 中間三個藍色區塊 -->
        <div class="middle-container">
            <div class="middle-block block"></div>
            <div class="middle-block block"></div>
            <div class="middle-block block"></div>
        </div>

        <!-- 底部四個灰色區塊 -->
        <div class="bottom-container">
            <div class="bottom-block block"></div>
            <div class="bottom-block block"></div>
            <div class="bottom-block block"></div>
            <div class="bottom-block block"></div>
        </div>
    </div>

</body>
</html>
