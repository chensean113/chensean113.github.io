<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>陳昱翔</title>
  
</head>
<body>

    <p id="propList"></p>
    <pre id="displayObject"></pre>

    <script>
        // 定義物件 [cite: 47, 88]
        var Person = {
            firstName : "Tony",
            lastName  : "Lee",
            age       : 50,
            eyeColor  : "Blue"
        };

        // 1. 列出所有屬性 ( menggunakan for...in 迴圈 ) [cite: 181, 183, 194]
        let props = [];
        for (let x in Person) {
            props.push(x);
        }
        document.getElementById("propList").innerHTML = "Properties: " + props.join(", ");

        // 2. 刪除 age 屬性 [cite: 206, 214]
        delete Person.age;

        // 3. 列印刪除後的物件 [cite: 307]
        document.getElementById("displayObject").innerHTML = JSON.stringify(Person, null, 4);
    </script>

</body>
</html>
