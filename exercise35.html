<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Assignment</title>
    <style>
        body { font-family: monospace; padding: 20px; line-height: 1.5; background-color: #ffffff; }
        pre { background: #f0f0f0; padding: 15px; border-radius: 5px; border: 1px solid #ccc; }
        .section { margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="section">
        <p id="propList"></p>
    </div>

    <div class="section">
        <pre id="displayObject"></pre>
    </div>

    <script>
        // 定義範例物件 
        var Person = {
            firstName : "Tony",
            lastName  : "Lee",
            age       : 50,
            eyeColor  : "Blue"
        };

        // 1. 列出所有屬性 (Properties) 
        let props = [];
        for (let x in Person) {
            props.push(x);
        }
        document.getElementById("propList").innerHTML = "Properties: " + props.join(", ");

        // 2. 刪除 age 屬性 
        delete Person.age;

        // 3. 列印刪除後的物件 
        document.getElementById("displayObject").innerHTML = JSON.stringify(Person, null, 4);
    </script>

</body>
</html>
