<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>陳昱翔</title>
  
</head>
<body>

    <p id="propList"></p>
    <p id="displayObject"></p>

    <script>
        
        var Person = {
            firstName : "Tony",
            lastName  : "Lee",
            age       : 50,
            eyeColor  : "Blue"
        };

        // 1. 列出所有屬性名稱 
        let txt = "";
        for (let x in Person) {
             txt += x + ": " + Person[x] + "<br>";
        }
        document.getElementById("propList").innerHTML = txt;

        // 2. 刪除 age 屬性 [cite: 206, 214]
        delete Person.age;

        // 3. 使用迴圈標示並列印刪除後的內容 [cite: 194, 196]
        let txt2 = "After delete:<br>";
        for (let x in Person) {
            // 逐一串接剩下的屬性與數值 [cite: 196]
            txt2 += x + ": " + Person[x] + "<br>";
        }
        document.getElementById("displayObject").innerHTML = txt2;
    </script>

</body>
</html>
